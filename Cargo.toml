[package]
name = "the-launcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A native, local-first game library with a console soul"
publish = false

[dependencies]
anyhow = "1"
directories = "6"
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
open = "5"
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
