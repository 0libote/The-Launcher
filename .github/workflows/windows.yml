name: Windows desktop
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    name: Windows MSVC build and tests
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install pinned Rust components
        run: rustup component add rustfmt clippy
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Check frontend and Rust core
        run: bun run check
      - name: Check native desktop code
        run: cargo clippy --features desktop --all-targets -- -D warnings
      - name: Test desktop services
        run: cargo test --features desktop --all-targets
      - name: Build Windows installer
        run: bun run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: the-launcher-windows-unsigned
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
